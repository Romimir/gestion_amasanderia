name: gestion_amasanderia
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - lib/assets/icons/

  fonts:
    - family: BerlinSans
      fonts:
        - asset: lib/assets/fonts/berlin.ttf
        - asset: lib/assets/fonts/berlin_demi.ttf
          weight: 700